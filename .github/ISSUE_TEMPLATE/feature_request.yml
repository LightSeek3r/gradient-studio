name: Idea or feature request
description: Something Gradient Studio could do better
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: The task you have in mind, and how you do it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could the app help?
      description: Your idea of the feature. A sketch or an example gradient is welcome.
