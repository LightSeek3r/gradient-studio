name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: css
    attributes:
      label: Exported CSS
      description: Paste the content of the Export CSS panel, so the gradient can be reproduced.
      render: css
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 130 on Windows 11
  - type: input
    id: version
    attributes:
      label: Where
      description: The live app, or a local build (with the version or commit).
      placeholder: https://gradient-studio-al4.pages.dev/
