name: release

# Manual only. Publishes @opal42/gradient and opal42 to npm with provenance via
# npm trusted publishing (OIDC): there is no long-lived npm token anywhere.
# Nothing is published until the owner has completed docs/RELEASING.md,
# including removing `"private": true` from the two packages. Until then even a
# run with dry_run=false fails at `npm publish`, by design.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify everything, but do not publish
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'LightSeek3r/gradient-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Ensure npm >= 11.5.1
        run: |
          npm install -g npm@^11.5.1
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm too old: "+process.argv[1]); process.exit(1) }' "$(npm --version)"

      - run: npm ci

      - name: Lint, type-check, test
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run vectors:diff

      - name: Build packages
        run: npm run build:packages

      - name: Verify packages
        run: |
          npm run lint:package
          npm run attw
          npm run size
          node packages/cli/dist/cli.js score packages/cli/tests/fixtures

      - name: Show what would be published
        run: |
          npm pack --dry-run -w @opal42/gradient
          npm pack --dry-run -w opal42

      - name: Publish (core first, then the CLI that depends on it)
        if: ${{ !inputs.dry_run }}
        run: |
          npm publish -w @opal42/gradient --provenance --access public
          npm publish -w opal42 --provenance --access public
