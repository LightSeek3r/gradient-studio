name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check core (no DOM)
        run: npm run typecheck -w @opal42/gradient

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build packages (core, CLI)
        run: npm run build:packages

      - name: publint
        run: npm run lint:package

      - name: Are the types wrong
        run: npm run attw

      - name: Size limit
        run: npm run size

      - name: CLI smoke test
        run: node packages/cli/dist/cli.js score packages/cli/tests/fixtures

      - name: Vectors unchanged
        run: npm run vectors:diff
