name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check core (no DOM)
        run: npm run typecheck -w @opal42/gradient

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build packages (core, CLI, MCP)
        run: npm run build:packages

      - name: publint
        run: npm run lint:package

      - name: Are the types wrong
        run: npm run attw

      - name: Size limit
        run: npm run size

      - name: CLI smoke test
        run: node packages/cli/dist/cli.js score packages/cli/tests/fixtures

      - name: MCP server smoke test
        run: |
          node packages/mcp/dist/cli.js --version
          (echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'; sleep 1) | node packages/mcp/dist/cli.js | grep -q score_gradient

      - name: Worker bundles (wrangler dry run; nothing is deployed)
        run: npm run build -w opal42-mcp-worker

      - name: Agent skill is valid
        run: node skills/gradient-quality/scripts/validate-skill.mjs skills/gradient-quality

      - name: Stylelint plugin smoke test
        run: npx stylelint --config packages/stylelint-plugin/tests/smoke.config.mjs packages/cli/tests/fixtures/smooth.css

      - name: VS Code extension bundles and packages
        run: npm run package -w gradient-score

      - name: Figma plugin bundles (not run inside Figma)
        run: npm run build:figma

      - name: Vectors unchanged
        run: npm run vectors:diff

  # Informational: runs the composite action from this checkout against the web
  # app's own CSS with the locally built CLI. No min-score, and the job can never
  # fail CI (continue-on-error); it exists to catch a broken action early.
  dogfood-action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build packages (core, CLI)
        run: npm run build:packages

      - name: Score the web app's CSS (annotations only)
        uses: ./actions/score
        continue-on-error: true
        with:
          paths: apps/web/src/**/*.css
          cli-path: packages/cli/dist/cli.js

  # Browser extension (apps/extension): typecheck, build both targets (the build
  # also diffs the manifests against the permission allow-list), then the
  # Playwright suite against the built Chrome build in real Chromium.
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check extension
        run: npm run typecheck:extension

      - name: Build extension (Chrome/Edge + Firefox) and check permissions
        run: npm run build:extension

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Extension browser tests
        run: npm run test:e2e:extension

  # Python port (ports/python): standard library only, no install step and no
  # network. Replays spec/vectors/*.json against the port and runs the unit and
  # property tests on the oldest and the newest supported Python. The interpreter
  # comes from the runner image's tool cache, so no action beyond the already
  # pinned checkout is needed.
  python-port:
    name: python-port (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Python ${{ matrix.python }} from the runner tool cache
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          dir=$(ls -d "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/Python/${PYTHON_VERSION}".*/x64 2>/dev/null | sort -V | tail -1)
          if [ -z "$dir" ]; then
            echo "Python ${PYTHON_VERSION} is not in the runner tool cache" >&2
            exit 1
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"

      - name: Python version
        run: python3 --version

      - name: Unit, property and conformance tests
        working-directory: ports/python
        run: python3 -m unittest discover -v

      - name: Conformance summary (exits 1 on any mismatch)
        working-directory: ports/python
        run: python3 scripts/check_conformance.py

      - name: Name table is generated from the TypeScript source
        working-directory: ports/python
        run: python3 scripts/gen_names.py --check
